<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definición de Sombras y Gradientes -->
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f4f8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Elementos de fondo (Hojas decorativas) -->
  <ellipse cx="120" cy="450" rx="40" ry="100" fill="#dcd1f0" transform="rotate(-20 120 450)" />
  <ellipse cx="160" cy="480" rx="35" ry="90" fill="#f2e9fb" transform="rotate(-10 160 480)" />

  <!-- El Documento -->
  <path d="M200 150 Q200 130 220 130 L550 130 Q570 130 570 150 L570 520 Q570 550 540 550 L230 550 Q200 550 200 520 Z" fill="url(#paperGrad)" filter="url(#shadow)"/>
  
  <!-- Líneas de texto en el documento -->
  <g fill="#cbd5e0">
    <rect x="250" y="190" width="280" height="8" rx="4"/>
    <rect x="250" y="220" width="280" height="8" rx="4"/>
    <rect x="250" y="250" width="200" height="8" rx="4"/>
    <rect x="250" y="300" width="280" height="8" rx="4"/>
    <rect x="250" y="330" width="250" height="8" rx="4"/>
    <rect x="250" y="380" width="280" height="2" rx="1"/>
    <rect x="250" y="420" width="280" height="2" rx="1"/>
  </g>

  <!-- Tintero -->
  <rect x="130" y="500" width="100" height="70" rx="10" fill="#2d3748"/>
  <rect x="150" y="485" width="60" height="15" rx="5" fill="#1a202c"/>

  <!-- Personaje (Simplificado) -->
  <!-- Piernas -->
  <path d="M720 550 L700 450 M760 550 L730 450" stroke="#1a202c" stroke-width="12" stroke-linecap="round"/>
  <!-- Cuerpo -->
  <ellipse cx="730" cy="400" rx="25" ry="50" fill="#4a90e2"/>
  <!-- Cabeza -->
  <circle cx="740" cy="340" rx="15" fill="#fbd38d"/>
  
  <!-- La Gran Pluma -->
  <g transform="rotate(-35 450 500)">
    <!-- Cuerpo de la pluma -->
    <rect x="430" y="100" width="40" height="400" rx="5" fill="#2d3748"/>
    <!-- Punta (Plumilla) -->
    <path d="M430 500 L450 550 L470 500 Z" fill="#ecc94b"/>
    <!-- Detalle de la plumilla -->
    <line x1="450" y1="500" x2="450" y2="540" stroke="#b45309" stroke-width="2"/>
    <!-- Brillo -->
    <rect x="435" y="110" width="5" height="380" rx="2" fill="#ffffff" fill-opacity="0.1"/>
  </g>

  <!-- Firma realizada -->
  <path d="M440 540 Q460 530 480 545 T530 540" fill="none" stroke="#2d3748" stroke-width="3" stroke-linecap="round"/>
</svg>